<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SnowBuddies: A Magical Winter Learning Adventure</title>
  <meta name="description" content="A gentle winter-themed learning game for preschoolers: letters, numbers, shapes, patterns and stories. Works offline, saves progress on your device only.">
  <meta name="theme-color" content="#BFE0F5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='68' r='28' fill='%23fff' stroke='%238EC3E8' stroke-width='5'/%3E%3Ccircle cx='50' cy='32' r='20' fill='%23fff' stroke='%238EC3E8' stroke-width='5'/%3E%3Ccircle cx='43' cy='29' r='3' fill='%231E2A4A'/%3E%3Ccircle cx='57' cy='29' r='3' fill='%231E2A4A'/%3E%3Cpath d='M30 20 Q50 0 70 20Z' fill='%23F4A08F'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="welcome">
  <a class="skip" href="#screens">Skip to the game</a>
  <canvas id="snow" aria-hidden="true"></canvas>

  <div id="app">
    <header id="hud">
      <div id="hud-left"></div>
      <div id="hud-right">
        <div id="coins" class="coins" role="status" aria-label="Snowflakes you have"><span aria-hidden="true">❄</span> <span id="coin-n">0</span></div>
        <button id="btn-mute" class="icon-btn" type="button" aria-pressed="false" aria-label="Mute everything">🔊</button>
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings">⚙️</button>
      </div>
    </header>
    <main id="screens"></main>
  </div>

  <div id="fx" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">SnowBuddies needs JavaScript to run. Please turn it on in your browser.</p></noscript>

  <script src="script.js"></script>
</body>
</html>
